name: hermes_app
description: Hermes Android session browser and streaming chat.
publish_to: none
version: 0.14.17+55
environment:
  # NOTIF2 B2: app_links 7.x (native deep-link intents) needs Dart >=3.12;
  # the repo toolchain (3.47.3 / Dart 3.13.3) is comfortably inside.
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # I18N-PLAN §1: SDK package for Material/Cupertino/Widgets built-in
  # strings. Transitive `intl` resolution updates pubspec.lock only.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  gpt_markdown: '>=1.2.1 <2.0.0'
  file_picker: '>=12.3.0 <13.0.0'
  path_provider: '>=2.1.6 <3.0.0'
  url_launcher: '>=6.3.2 <7.0.0'
  crypto: '>=3.0.6 <4.0.0'
  photo_manager: ^3.12.0
  web: ^1.1.1
  http: ^1.6.0
  app_links: ^7.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test seams for plugin mocks (AUDIT-01/02 picker tests).
  plugin_platform_interface: ^2.1.8
  cross_file: ^0.3.4
  xml: ^7.1.0
flutter:
  uses-material-design: true
