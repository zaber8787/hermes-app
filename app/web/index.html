<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hermes_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hermes_app</title>
  <link rel="manifest" href="manifest.json">
  <script id="hermes-share-entry">
    // TASK-WEBUX2 B-B: a shared entry carries the pair in the FRAGMENT only
    // (#token=..&server=..) — a query string would land in serve.py's access
    // log (ticket §6: no token in logs). Fragments are never sent to the
    // server at all. The values are written straight into the storage the
    // app itself reads (key_vault_web.dart prefix + shared_preferences_web
    // prefix/json encoding), then the fragment is dropped before any code
    // can observe it. A '#/chat?..' launch link is NOT an entry: never
    // touch it (run_link.dart owns that shape and rejects secrets anyway).
    (function () {
      var h = location.hash;
      if (!h || h.indexOf('token=') < 0 || h.indexOf('#/') === 0) return;
      history.replaceState(history.state, '',
        location.pathname + location.search);
      var q = new URLSearchParams(h.replace(/^#/, ''));
      var token = (q.get('token') || '').trim();
      var server = (q.get('server') || '').trim();
      if (!token || /\s/.test(token)) return;
      try {
        window.localStorage.setItem('hermes.vault.server.key', token);
        if (/^https?:\/\//.test(server)) {
          // shared_preferences_web stores JSON-encoded values under
          // 'flutter.<key>' (shared_preferences_web.dart:26,93,265).
          window.localStorage.setItem('flutter.server.url',
            JSON.stringify(server));
        }
      } catch (e) {
        // Quota/private-mode failure: the manual form still works. The
        // token itself is never logged.
        console.warn('hermes-web: shared entry could not be stored',
          e && e.name);
      }
    })();
  </script>
  <script id="hermes-entry-log">
    // TASK-WEBUX3-01: entry self-reporting. The 'only a fresh Chrome
    // instance gets in' failure left no evidence anyone could capture,
    // so the entry page records its own death to the server instead.
    // Two record points, both inside this block:
    //   A: our own 20000ms deadline before 'flutter-first-frame'
    //      (the watchdog keeps its own independent timer and notice;
    //      the two constants may drift apart — known, documented).
    //   B: the service-worker ACTIVATION timeout, which flutter.js
    //      swallows into console.warn — a window error/unhandledrejection
    //      listener can never see it. Non-timeout SW errors are out of
    //      scope. Fields are whitelisted to {ts, kind, build}: never a
    //      URL, hash, query, header value, stored value or error text.
    // Nothing here navigates; a failing report never changes the page.
    // If localStorage is unavailable (private mode, quota) the whole
    // block degrades silently.
    (function () {
      var KEY = 'hermes.entrylog.v1', MAX = 50, REC_MAX = 1024,
        BOOT_MS = 20000, booted = false, flushed = false, swSeen = false;
      function lsGet(k) {
        try { return window.localStorage.getItem(k); } catch (e) { return null; }
      }
      function lsSet(k, v) {
        try { window.localStorage.setItem(k, v); } catch (e) {}
      }
      function load() {
        var v = lsGet(KEY);
        if (!v) return [];
        try {
          var arr = JSON.parse(v);
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }
      function send() {
        var k = lsGet('hermes.vault.server.key');
        if (!k) return;
        var batch = load();
        if (batch.length === 0) return;
        fetch('/clientlog', {
          method: 'POST', keepalive: true,
          headers: {'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + k},
          body: JSON.stringify({records: batch})
        }).then(function (r) {
          if (!r.ok) return;
          var sent = {}, i;
          for (i = 0; i < batch.length; i++) sent[JSON.stringify(batch[i])] = 1;
          var rest = load().filter(function (rec) {
            return !sent[JSON.stringify(rec)];
          });
          lsSet(KEY, JSON.stringify(rest));
        }, function () {});
      }
      function record(kind) {
        var rec = {ts: Date.now(), kind: kind,
                   build: window.HERMES_BUILD || 'unknown'};
        var line = JSON.stringify(rec);
        if (unescape(encodeURIComponent(line)).length > REC_MAX) return;
        var arr = load();
        arr.push(rec);
        if (arr.length > MAX) arr.splice(0, arr.length - MAX);
        lsSet(KEY, JSON.stringify(arr));
        send();  // same event loop: the page may be dying
      }
      var warn = console.warn;
      console.warn = function () {
        if (!swSeen && typeof arguments[0] === 'string'
            && arguments[0].indexOf(
              'Exception while loading service worker') === 0
            && arguments[1]
            && String(arguments[1].message).indexOf(
              'prepareServiceWorker') >= 0) {
          swSeen = true;
          record('sw-timeout');
        }
        return warn.apply(console, arguments);
      };
      window.addEventListener('flutter-first-frame', function () {
        booted = true;
        if (!flushed) {
          flushed = true;
          if (load().length > 0) send();  // deferred retry, once per page
        }
      });
      setTimeout(function () {
        if (!booted) record('boot-timeout');
      }, BOOT_MS);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // WEBSYNC F5: the service worker is exit-style (install/activate only —
    // it never caches or pushes), so an ALREADY-OPEN tab cannot learn about
    // a new release from the SW. Visible signal instead, without touching
    // the no-cache bootstrap relay: this page embeds the loaded bundle's
    // build ID, checks version.json at load, then checks it a few seconds
    // later and every five minutes. The embedded ID remains the baseline
    // even when the first network check fails. On a
    // mismatch says so in the console and shows a click-to-reload chip.
    // No silent navigation — an active send is never reloaded underneath
    // the user; the chip is the only trigger.
    (function () {
      var mine = {build: '__HERMES_BUILD_ID__'}, CHECK_MS = 300000,
        FIRST_MS = 15000, chip = null;
      window.HERMES_BUILD = mine.build;
      function zh() {
        return (document.documentElement.lang || navigator.language || '')
          .toLowerCase().indexOf('zh') === 0;
      }
      function show(fresh) {
        console.warn('hermes-web: a newer build is live (' + mine.build +
          ' -> ' + fresh.build + '); reload this tab to load it.');
        if (chip) return;
        chip = document.createElement('div');
        chip.setAttribute('role', 'alert');
        chip.textContent = zh()
          ? '新版本已發佈 — 点此重新载入'
          : 'A new version is available — click to reload';
        chip.style.cssText = 'position:fixed;left:50%;bottom:14px;' +
          'transform:translateX(-50%);z-index:2147483647;cursor:pointer;' +
          'padding:8px 14px;border-radius:8px;font:13px/1.4 system-ui;' +
          'background:#1b1b1bee;color:#fff;box-shadow:0 2px 10px #0006';
        chip.addEventListener('click', function () { location.reload(); });
        document.body.appendChild(chip);
      }
      function url() { return new URL('version.json', document.baseURI).href; }
      async function probe() {
        try {
          var r = await fetch(url(), { cache: 'no-store' });
          if (!r.ok) return null;
          return await r.json();
        } catch (e) { return null; }
      }
      async function start() {
        try { await check(); }
        finally {
          setTimeout(check, FIRST_MS);
          setInterval(check, CHECK_MS);
        }
      }
      async function check() {
        var fresh = await probe();
        if (fresh && fresh.build && fresh.build !== mine.build) show(fresh);
      }
      if (document.readyState === 'complete') start();
      else window.addEventListener('load', start);
    })();
  </script>
  <script id="hermes-boot-watchdog">
    // TASK-WEBUX2 B: if main.dart.js (or the service-worker activation wait
    // in front of it) never produces a first frame, no Dart-side timeout
    // exists that could report it — the user just stares at a blank page.
    // This watchdog only shows a visible notice; it never navigates or
    // reloads on its own ("No silent navigation" above applies to it too).
    (function () {
      var BOOT_MS = 20000, booted = false, notice = null;
      function zh() {
        return (document.documentElement.lang || navigator.language || '')
          .toLowerCase().indexOf('zh') === 0;
      }
      window.addEventListener('flutter-first-frame', function () {
        booted = true;
        if (notice) notice.remove();
      });
      setTimeout(function () {
        if (booted || notice || !document.body) return;
        notice = document.createElement('div');
        notice.id = 'hermes-boot-watchdog-notice';
        notice.setAttribute('role', 'status');
        notice.textContent = zh()
          ? '網頁載入逾時：請手動重新整理。異常已自動記錄回報。'
          : 'The page took too long to load: reload it manually. The ' +
            'failure was recorded and reported automatically.';
        notice.style.cssText = 'position:fixed;left:50%;top:14px;' +
          'transform:translateX(-50%);z-index:2147483647;' +
          'padding:8px 14px;border-radius:8px;font:13px/1.4 system-ui;' +
          'background:#1b1b1bee;color:#fff;box-shadow:0 2px 10px #0006';
        document.body.appendChild(notice);
      }, BOOT_MS);
    })();
  </script>
</body>
</html>
