<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hermes_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hermes_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // WEBSYNC F5: the service worker is exit-style (install/activate only —
    // it never caches or pushes), so an ALREADY-OPEN tab cannot learn about
    // a new release from the SW. Visible signal instead, without touching
    // the no-cache bootstrap relay: this page snapshots the release's
    // version.json at load (the very file publish.sh swaps atomically),
    // rechecks it a few seconds later and every five minutes, and on a
    // mismatch says so in the console and shows a click-to-reload chip.
    // No silent navigation — an active send is never reloaded underneath
    // the user; the chip is the only trigger.
    (function () {
      var mine = null, CHECK_MS = 300000, FIRST_MS = 15000, chip = null;
      function zh() {
        return (document.documentElement.lang || navigator.language || '')
          .toLowerCase().indexOf('zh') === 0;
      }
      function show(fresh) {
        console.warn('hermes-web: a newer build is live (' + mine.build +
          ' -> ' + fresh.build + '); reload this tab to load it.');
        if (chip) return;
        chip = document.createElement('div');
        chip.setAttribute('role', 'alert');
        chip.textContent = zh()
          ? '新版本已發佈 — 点此重新载入'
          : 'A new version is available — click to reload';
        chip.style.cssText = 'position:fixed;left:50%;bottom:14px;' +
          'transform:translateX(-50%);z-index:2147483647;cursor:pointer;' +
          'padding:8px 14px;border-radius:8px;font:13px/1.4 system-ui;' +
          'background:#1b1b1bee;color:#fff;box-shadow:0 2px 10px #0006';
        chip.addEventListener('click', function () { location.reload(); });
        document.body.appendChild(chip);
      }
      function url() { return new URL('version.json', document.baseURI).href; }
      async function probe() {
        try {
          var r = await fetch(url(), { cache: 'no-store' });
          if (!r.ok) return null;
          return await r.json();
        } catch (e) { return null; }
      }
      async function start() {
        mine = await probe();
        if (!mine || !mine.build) return;
        setTimeout(check, FIRST_MS);
        setInterval(check, CHECK_MS);
      }
      async function check() {
        var fresh = await probe();
        if (fresh && fresh.build && fresh.build !== mine.build) show(fresh);
      }
      if (document.readyState === 'complete') start();
      else window.addEventListener('load', start);
    })();
  </script>
</body>
</html>
